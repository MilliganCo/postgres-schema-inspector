[project]
name = "postgres-schema-inspector"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2",
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2.7",
]

[project.scripts]
pginspect = "pginspect.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pginspect"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = ["--strict-config", "--strict-markers", "-ra"]
markers = [
  "unit: tests without external services",
  "integration: tests requiring PostgreSQL",
  "safety: adversarial write-enforcement tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pginspect"]

[tool.coverage.run]
branch = true
source = ["pginspect"]

[tool.coverage.report]
fail_under = 90
show_missing = true
