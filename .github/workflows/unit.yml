name: unit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install package and CI tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements/ci.txt

      - name: Run unit tests
        env:
          PYTHONUTF8: "1"
        run: python -m pytest tests/unit -v

  package-build-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci.txt

      - name: Build sdist and wheel
        run: python -m build

      - name: Inspect wheel contents
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          wheels = list(Path("dist").glob("*.whl"))
          assert wheels, "no wheel produced"
          wheel = wheels[0]
          names = zipfile.ZipFile(wheel).namelist()
          joined = "\n".join(names)
          assert "tests/" not in joined and not any(n.startswith("tests/") for n in names)
          assert ".env" not in joined
          assert not any(n.endswith(".pgpass") for n in names)
          assert not any("credential" in n.lower() for n in names)
          print(f"wheel ok: {wheel.name} ({len(names)} entries)")
          PY

      - name: Install wheel into clean venv and smoke CLI
        run: |
          python -m venv .venv-smoke
          .venv-smoke/bin/pip install --upgrade pip
          .venv-smoke/bin/pip install dist/*.whl
          .venv-smoke/bin/pip check
          .venv-smoke/bin/pginspect version
          .venv-smoke/bin/pginspect connect-test --help
