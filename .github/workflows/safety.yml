name: safety

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
        postgres: ["14", "15", "16", "17", "18"]
    services:
      postgres:
        # Official tag; pin digest before public release if SHA unknown.
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pginspect_ci_postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGINSPECT_TEST_DSN: postgresql://postgres:pginspect_ci_postgres@localhost:5432/postgres
      PGINSPECT_EXPECT_PG_MAJOR: ${{ matrix.postgres }}
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and CI tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements/ci.txt

      - name: Assert PostgreSQL major matches matrix
        run: |
          python - <<'PY'
          import os
          import psycopg
          dsn = os.environ["PGINSPECT_TEST_DSN"]
          expect = int(os.environ["PGINSPECT_EXPECT_PG_MAJOR"])
          with psycopg.connect(dsn) as conn:
              num = int(conn.execute("SHOW server_version_num").fetchone()[0])
          major = num // 10000
          assert major == expect, (num, major, expect)
          print(f"ok server_version_num={num} major={major}")
          PY

      - name: Run safety write-probes
        run: python -m pytest tests/safety -v
