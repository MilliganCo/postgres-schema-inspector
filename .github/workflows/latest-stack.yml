name: latest-stack

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  latest-stack:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Official tag; pin digest before public release if SHA unknown.
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pginspect_ci_postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGINSPECT_TEST_DSN: postgresql://postgres:pginspect_ci_postgres@localhost:5432/postgres
      PGINSPECT_EXPECT_PG_MAJOR: "18"
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Install package and CI tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements/ci.txt

      - name: Smoke connect-test (JSON)
        run: |
          python - <<'PY'
          import os
          import json
          import psycopg
          from pginspect.config import ConnectionConfig, ConnectTestConfig
          from pginspect.connectivity import run_connect_test
          from pginspect.renderers import render_json

          # Apply probe fixture once for write-probe smoke.
          fixture = open("tests/fixtures/pginspect_probe.sql", encoding="utf-8").read()
          with psycopg.connect(os.environ["PGINSPECT_TEST_DSN"], autocommit=True) as conn:
              conn.execute(fixture)
              num = int(conn.execute("SHOW server_version_num").fetchone()[0])
              assert num // 10000 == 18, num

          os.environ["PGPASSWORD"] = "pginspect_test_ci"
          config = ConnectTestConfig(
              connection=ConnectionConfig(
                  host="localhost",
                  port=5432,
                  dbname="postgres",
                  user="pginspect_test",
                  connect_timeout_s=10,
              )
          )
          result = run_connect_test(config)
          assert result.exit_code == 0, result
          payload = json.loads(render_json(result))
          assert payload["outcome"] == "completed"
          print("connect-test smoke ok")
          PY

      - name: Smoke one write-probe (INSERT → 25006)
        run: |
          python -m pytest tests/safety/test_write_probes.py::test_write_probe_rejected_with_25006[insert] -v
