name: schema

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install package and CI tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements/ci.txt

      - name: Schema drift and golden validation
        env:
          PYTHONUTF8: "1"
        run: |
          python -m pytest tests/unit/test_schema_drift.py tests/unit/impact/test_schema_drift.py -v

      - name: Compare fresh export to committed schemas
        run: python scripts/compare_schemas_export.py
